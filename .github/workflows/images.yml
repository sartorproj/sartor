name: Images

# Builds the distroless controller and server images for linux/amd64 and linux/arm64.
# Pull requests build (and smoke-test amd64) without pushing; v* tags push to GHCR.
on:
  pull_request:
    branches: [main]
  push:
    tags:
    - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: sartor
          dockerfile: Dockerfile
          description: Sartor controller
        - name: sartor-server
          dockerfile: Dockerfile.server
          description: Sartor API server
    env:
      IMAGE: ghcr.io/sartorproj/${{ matrix.name }}
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # No QEMU: the Dockerfiles cross-compile on $BUILDPLATFORM and the final stage has no RUN.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to GitHub Container Registry
      if: env.PUSH == 'true'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      with:
        images: ${{ env.IMAGE }}
        # v1.2.3 -> 1.2.3, 1.2, 1, v1.2.3, sha-<short>, latest (latest/major.minor skipped for pre-releases).
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          type=ref,event=tag
          type=ref,event=pr
          type=sha
        labels: |
          org.opencontainers.image.title=${{ matrix.name }}
          org.opencontainers.image.description=${{ matrix.description }}
          org.opencontainers.image.licenses=Apache-2.0
        annotations: |
          org.opencontainers.image.title=${{ matrix.name }}
          org.opencontainers.image.description=${{ matrix.description }}
          org.opencontainers.image.licenses=Apache-2.0

    - name: Build amd64 image for smoke test
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        load: true
        push: false
        provenance: false
        tags: ${{ matrix.name }}:smoke
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          COMMIT=${{ github.sha }}
          DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
        cache-from: type=gha,scope=${{ matrix.name }}

    - name: Smoke test
      run: |
        set -euo pipefail
        user=$(docker image inspect "${{ matrix.name }}:smoke" --format '{{.Config.User}}')
        test "$user" = "65532:65532" || { echo "unexpected image user: $user"; exit 1; }
        docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
          "${{ matrix.name }}:smoke" --version | tee /dev/stderr | grep -F "${{ steps.meta.outputs.version }}"

    - name: Build and push
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        push: ${{ env.PUSH == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        provenance: mode=max
        sbom: true
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          COMMIT=${{ github.sha }}
          DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.name }}

    - name: Summary
      run: |
        {
          echo "### ${IMAGE}"
          echo "Pushed: ${PUSH}"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          echo '```'
          echo "${{ steps.meta.outputs.tags }}"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
