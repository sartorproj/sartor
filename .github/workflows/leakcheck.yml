name: Leak Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  leakcheck:
    name: Leak Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Secrets are not passed to workflows from forks; the scan then runs the
      # generic checks only. The variable fallback is not secret (see docs/leakcheck.md).
      - name: Load denylist
        env:
          DENYLIST_SECRET: ${{ secrets.LEAKCHECK_DENYLIST }}
          DENYLIST_VAR: ${{ vars.LEAKCHECK_DENYLIST }}
        run: |
          umask 077
          if [ -n "$DENYLIST_SECRET" ]; then
            printf '%s\n' "$DENYLIST_SECRET" > .leakcheck-denylist
          elif [ -n "$DENYLIST_VAR" ]; then
            printf '%s\n' "$DENYLIST_VAR" > .leakcheck-denylist
          fi
          python3 hack/leakcheck/leakcheck.py --register-masks

      - name: Scan
        env:
          LEAKCHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          LEAKCHECK_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          LEAKCHECK_PR_TITLE: ${{ github.event.pull_request.title }}
          LEAKCHECK_PR_BODY: ${{ github.event.pull_request.body }}
          LEAKCHECK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python3 hack/leakcheck/leakcheck.py

      - name: Remove denylist
        if: always()
        run: rm -f .leakcheck-denylist

  selftest:
    name: Leak Check Self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run tests
        run: python3 -m unittest discover -s hack/leakcheck -v
