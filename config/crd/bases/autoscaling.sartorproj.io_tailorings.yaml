                            format: int32
                            type: integer
                          container:
                            description: |-
                              Container is set for a ContainerResource metric (or a KEDA trigger
                              with containerName); empty means the sum over the pod's containers.
                            type: string
                          resource:
                            description: Resource is cpu or memory.
                            type: string
                        required:
                        - averageUtilization
                        - resource
                        type: object
                      type: array
