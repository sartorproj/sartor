                        a KEDA trigger type.
                      items:
                        type: string
                      type: array
                    updateMode:
                      description: UpdateMode is the VPA update mode (Off, Initial,
                        Recreate, Auto, ...).
                      type: string
                    utilizationResources:
                      description: |-
                        UtilizationResources lists the resources (cpu, memory) the HPA scales
                        on with a Utilization target, i.e. relative to the requests.
                      items:
                        type: string
                      type: array
                    utilizationTargets:
                      description: UtilizationTargets are the cpu/memory Utilization
