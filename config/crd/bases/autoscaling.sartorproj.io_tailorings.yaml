                      format: int32
                      type: integer
                    minReplicas:
                      description: |-
                        MinReplicas is the HPA minReplicas (ScaledObject minReplicaCount).
                        Unset when the source does not expose it.
                      format: int32
                      type: integer
                    name:
                      description: Name is the autoscaler name. Empty when the source
