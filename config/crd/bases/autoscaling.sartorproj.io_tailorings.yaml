                      Cluster is the value of the Atelier's prometheus.clusterLabel that
                      selects the target workload's cluster in the metrics backend.
                      Required when clusterLabel is set.
                    type: string
                  kind:
                    description: Kind is the kind of the target resource (Deployment,
                      StatefulSet, etc.).
                    enum:
                    - Deployment
                    - StatefulSet
                    - DaemonSet
                    type: string
                  name:
                    description: Name is the name of the target resource.
                    type: string
                  namespace:
