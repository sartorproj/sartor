apiVersion: autoscaling.sartorproj.io/v1alpha1
kind: Atelier
metadata:
  labels:
    app.kubernetes.io/name: sartorproj
    app.kubernetes.io/managed-by: kustomize
  name: default
spec:
  prometheus:
    url: http://prometheus.monitoring.svc:9090
    # VictoriaMetrics cluster (vmselect, tenant 0), scoped to one cluster's series:
    # url: http://vmselect.monitoring.svc:8481/select/0/prometheus?extra_label=cluster=staging-base-cluster
  gitProvider:
    type: github
    # Keys: token, or appId + installationId + privateKey (GitHub App).
    # Must live in the controller's namespace.
    secretRef:
      name: github-token
      namespace: sartor-system
  prSettings:
    cooldownPeriod: 168h
    minChangePercent: 20
    baseBranch: main
    branchPrefix: sartor/
    labels:
      - sartor
  safetyRails:
    minCPU: 10m
    minMemory: 64Mi
    maxCPU: "8"
    maxMemory: 32Gi
  defaultAnalysisWindow: 168h
